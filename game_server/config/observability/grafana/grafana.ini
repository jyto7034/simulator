[server]
http_addr = 127.0.0.1
http_port = 3000
[analytics]
reporting_enabled = false
check_for_updates = false
[news]
news_feed_enabled = false
[dashboards]
min_refresh_interval = 1s
[auth.anonymous]
enabled = true
org_role = Viewer
[auth]
disable_login_form = true
[users]
allow_sign_up = false
[plugins]
preinstall_disabled = true
