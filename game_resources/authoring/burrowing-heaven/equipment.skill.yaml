# 현행 의미의 작성 원본. Unresolved는 출시 미정이며 시험값과 분리합니다.
version: 2
id: burrowing-heaven-equipment
values:
- name: opening-protection
  value:
    DefenseProgram:
      ChannelOpeningGuard:
        duration_ms:
          Unresolved: opening-duration-ms
        reduction_percent:
          Unresolved: opening-reduction-percent
- name: lingering-gaze
