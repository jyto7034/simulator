            duration:
              moment: Live
              root:
                Const:
                  value:
                    Unresolved: root-duration-ms
                  unit: Milliseconds
            profile:
              definition: lingering-root
              kind: Root
definitions: []
skills: []
equipment_defenses:
- equipment: placeholder_burrowing_heaven_armor
