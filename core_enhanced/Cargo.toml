[package]
name = "game_core"
version = "0.1.0"
edition = "2021"
description = "card backend"
autobins = false

[[bin]]
name = "compile_node_graph"
path = "src/bin/compile_node_graph.rs"
test = false
bench = false

[[bin]]
name = "compile_skill_composition"
path = "src/bin/compile_skill_composition.rs"
test = false
bench = false

[[bin]]
name = "compile_skill_source"
path = "src/bin/compile_skill_source.rs"
test = false
bench = false

[[bin]]
name = "author_content"
path = "src/bin/author_content.rs"
test = false
bench = false

[[bin]]
name = "run_skill_source"
path = "src/bin/run_skill_source.rs"
test = false
bench = false

[[bin]]
name = "package_official_content"
path = "src/bin/package_official_content.rs"
test = false
bench = false

[[bin]]
name = "consume_content_pack"
path = "src/bin/consume_content_pack.rs"
test = false
bench = false

[[bin]]
name = "generate_encounter_compendium_contract_fixture"
path = "src/bin/generate_encounter_compendium_contract_fixture.rs"
test = false
bench = false
required-features = ["test-fixtures"]

[[bin]]
name = "generate_event_contract_fixture"
path = "src/bin/generate_event_contract_fixture.rs"
test = false
bench = false
required-features = ["test-fixtures"]

[[bin]]
name = "generate_inventory_contract_fixture"
path = "src/bin/generate_inventory_contract_fixture.rs"
test = false
bench = false
required-features = ["test-fixtures"]

[[bin]]
name = "generate_shop_contract_fixture"
path = "src/bin/generate_shop_contract_fixture.rs"
test = false
bench = false
required-features = ["test-fixtures"]

[dependencies]
rand = "0.8.5"
rapier2d = "0.32.0"
ron = "0.5.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
yaml-rust2 = { version = "=0.13.0", default-features = false }
sha2 = "0.10.9"
hmac = "=0.12.1"
fs2 = "0.4"
tracing = "0.1.41"
uuid = { version = "1.14.0", features = ["v4", "serde"] }

[build-dependencies]
sha2 = "0.10.9"
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.0.7", features = ["fs", "process"] }

[features]
# Event-log validation/replay tests will be redesigned; keep them opt-in for now.
event_log_checks = []
# Non-default capability for dedicated Core test/support crates. Production
# release builds do not expose bare game-data construction.
test-fixtures = []
# Optional fixed-size runtime observations; no exporter dependencies in Core.
runtime-observation = []
