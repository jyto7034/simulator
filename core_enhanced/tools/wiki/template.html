<aside class="sidebar" id="sidebar" aria-label="위키 탐색"><a class="brand" href="#home">ARK <small>GAME ENCYCLOPEDIA</small></a><div class="side-rule"></div><nav id="nav"></nav><div class="sidefooter">INTERNAL DESIGN WIKI<br>합의 · 제안 · 미정의 구분을 유지합니다.<br>설계 상태와 구현 여부는 별개입니다.</div></aside>

<div class="shell"><header class="topbar"><button id="menu" aria-label="탐색 메뉴 열기" aria-controls="sidebar" aria-expanded="false">☰</button><span class="toplabel">ARK / GAME WIKI</span><div class="searchbox"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="위키 전체 검색" placeholder="환상체, 스킬, 유물, 플레이어 행동 검색…" autocomplete="off"><kbd>/</kbd></div><button id="print" aria-label="현재 문서 인쇄" title="현재 문서 인쇄">인쇄</button></header><main id="main" class="content" tabindex="-1"></main><footer class="pagefooter"><span>ARK 게임 위키 · 콘텐츠와 플레이 경험을 연결하는 설계 도감</span><a href="#about">출처와 갱신 방법</a></footer></div>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('wiki-data').textContent),$=s=>document.querySelector(s),main=$('#main'),pages=Object.values(DATA.pages),categories=Object.fromEntries(DATA.categories.map(c=>[c.id,c])),groups=Object.fromEntries(DATA.groups.map(g=>[g.id,g]));

const url=(id,anchor='')=>'#page='+encodeURIComponent(id)+(anchor?'&section='+encodeURIComponent(anchor):''),sceneURL=(id,a='')=>'#scene='+encodeURIComponent(id)+(a?'&action='+encodeURIComponent(a):'');
const categoryURL=id=>'#category='+encodeURIComponent(id),actionCount=DATA.scenes.reduce((n,s)=>n+s.actions.length,0);
const partNames={README:'개요',encounter:'조우',fragment:'스킬 파편',equipment:'장비',synergies:'태그·유물',reference:'원작 참고',review:'검토 기록'};
const categoryPages=id=>pages.filter(p=>p.category===id&&(!p.index||p.id==='content/tags/README')&&(id!=='abnormalities'||p.part==='README'||p.id.startsWith('content/tools/')));

let sceneState={group:'',status:''},searchState={category:'',history:false},activeScene=null,activeImage=0,searchTimer;
function link(id,label){return `<a href="${url(id)}">${esc(label||DATA.pages[id]?.title||id)}</a>`}
function nav(){const n=(id,label,icon,href,count='')=>`<a class="navlink" data-nav="${id}" href="${href}"><span class="navicon" aria-hidden="true">${icon}</span>${label}${count!==''?`<span class="navcount">${count}</span>`:''}</a>`;$('#nav').innerHTML=n('home','위키 홈','⌂','#home')+'<div class="navlabel">콘텐츠 도감</div>'+DATA.categories.slice(0,4).map(c=>n(c.id,c.title,c.icon,categoryURL(c.id),categoryPages(c.id).length)).join('')+'<div class="navlabel">플레이 가이드</div>'+n('scenes','장면·플레이어 행동','▣','#scenes',actionCount)+n('rules','게임 규칙','≡',categoryURL('rules'))+n('ui','화면 상세','⊞',categoryURL('ui'))+n('catalog','전체 화면 목록','▤','#catalog')+'<div class="navlabel">설계와 기록</div>'+n('principles','공통 설계 기준','⌘',categoryURL('principles'))+n('history','아카이브','◷',categoryURL('history'))}
function activeNav(id){document.querySelectorAll('[data-nav]').forEach(a=>{const on=a.dataset.nav===id;a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function crumb(parts=[]){return `<div class="crumb"><a href="#home">위키 홈</a>${parts.map(p=>`<span>/</span>${Array.isArray(p)?`<a href="${p[1]}">${esc(p[0])}</a>`:`<span>${esc(p)}</span>`}`).join('')}</div>`}
function sceneCard(s,actions=s.actions){return `<article class="scene-card"><a href="${sceneURL(s.id)}" tabindex="-1" aria-hidden="true">${s.images.length?`<img src="${s.images[0].url}" alt="" loading="lazy">`:'<span class="empty-art">대표 시안 미등록</span>'}</a><div class="scene-card-body"><div class="meta">${esc(groups[s.group].title)} · ${esc(s.kind)} · ${actions.length===s.actions.length?s.actions.length:actions.length+' / '+s.actions.length}개 행동</div><h3><a href="${sceneURL(s.id)}">${esc(s.title)}</a></h3><p>${esc(s.subtitle)}</p><div class="chips">${actions.map(a=>`<a class="chip action-link" href="${sceneURL(s.id,a.id)}">${esc(a.title)}</a>`).join('')}</div></div></article>`}
function home(){searchState.history=false;activeNav('home');const rest=DATA.scenes.find(s=>s.id==='rest');main.innerHTML=`<section class="hero"><div><div class="eyebrow">A FIELD GUIDE TO ARK</div><h1><span>ARK</span><br>세계와 플레이를 읽다.</h1><p class="lead">환상체를 만나고, 능력을 조합하고, 다음 행동을 고르기까지.<br>콘텐츠의 상세 정보와 장면별 플레이 방법을 한곳에서 찾아보세요.</p><a class="buttonlink" href="${categoryURL('abnormalities')}">환상체 도감 →</a><a class="buttonlink secondary" href="#scenes">플레이 가이드 ↗</a></div><figure class="herofigure"><img src="${rest.images[0].url}" alt="직원들이 모인 세이프존 휴식 화면 시안"><figcaption>세이프존 · 휴식 화면 시안</figcaption></figure></section><div class="stats"><div class="stat"><b>${categoryPages('abnormalities').length}</b><span>환상체·도구</span></div><div class="stat"><b>${categoryPages('relics').length}</b><span>유물 항목</span></div><div class="stat"><b>${DATA.groups.length}</b><span>상세 장면</span></div><div class="stat"><b>${actionCount}</b><span>플레이어 행동</span></div></div><section><div class="sectionhead"><h2>콘텐츠 도감</h2><small>항목을 고르면 관련 능력과 규칙으로 이어집니다.</small></div><div class="directory">${DATA.categories.slice(0,5).map(c=>`<a href="${categoryURL(c.id)}"><span class="symbol" aria-hidden="true">${c.icon}</span><strong>${c.title}<span class="number">${categoryPages(c.id).length} 항목 ↗</span></strong><small>${c.description}</small></a>`).join('')}</div></section><section><div class="sectionhead"><h2>어디에서, 무엇을 할 수 있나</h2><a href="#scenes">${DATA.scenes.length}개 화면·모드 모두 보기 →</a></div><div class="flow"><a href="${sceneURL('rest')}">세이프존 준비</a>↔<a href="${sceneURL('map')}">지도·노드 이동</a>→<a href="${sceneURL('battle')}">전투</a><span>/</span><a href="${sceneURL('maintenance')}">메인터넌스</a><small>활동을 마치면 세이프존으로 돌아옵니다. 휴식과 지도는 같은 장면의 보기입니다.</small></div><div class="scenegrid">${['rest','maintenance','battle'].map(id=>sceneCard(DATA.scenes.find(s=>s.id===id),DATA.scenes.find(s=>s.id===id).actions.slice(0,3))).join('')}</div></section><section><div class="sectionhead"><h2>이어서 살펴볼 콘텐츠</h2><small>최근 합의가 반영된 설계</small></div><div class="featurelist">${[['knight-of-despair','절망의 기사','검과 가호, 절망 상태의 연속기.'],['queen-of-hatred','증오의 여왕','하트와 히스테릭, 회복과 공격의 연결.'],['yin-yang','음양','두 영역의 순환 회복과 교집합 버프.']].map(([id,t,d])=>`<div class="feature"><div class="meta">ABNORMALITY / SKILL FRAGMENT</div><h3>${link('content/abnormalities/'+id+'/README',t)}</h3><p>${d}</p><div class="chips">${link('content/abnormalities/'+id+'/fragment','파편 상세')} · ${link('content/abnormalities/'+id+'/synergies','태그·유물')}</div></div>`).join('')}</div></section><p class="footnote">내부 설계 위키입니다. 합의·초안·미정 표시는 각 본문을 따르며 구현 완료를 뜻하지 않습니다. 이전 설계는 <a href="${categoryURL('history')}">검토·기록</a>에서 찾아볼 수 있습니다.</p>`}
function category(id){if(id==='tags'){location.replace(url('content/tags/README'));return}searchState.history=id==='history';const c=categories[id];if(!c)return missing();activeNav(id);const list=categoryPages(id),tiers=[...new Set(list.map(p=>p.tier).filter(Boolean))];main.innerHTML=crumb([c.title])+`<div class="category-head"><div><div class="eyebrow">ENCYCLOPEDIA / ${esc(id.toUpperCase())}</div><h1>${c.title}</h1></div><span class="countlabel">${list.length}개 항목</span></div><p class="lead">${c.description}. 각 항목에서 상세 설명과 연결된 문서를 찾아볼 수 있습니다.</p>${id==='history'?'<p><a href="#archive-search=">아카이브 본문 검색</a> · <a href="#home">현재 위키</a></p>':''}<div class="filters"><input id="list-search" type="search" aria-label="${c.title} 목록 검색" placeholder="이 목록에서 이름 검색…">${tiers.length?`<select id="tier" aria-label="분류 필터"><option value="">모든 분류</option>${tiers.map(t=>`<option>${esc(t)}</option>`).join('')}</select>`:''}</div><div id="list-count" class="result-meta" aria-live="polite"></div><div id="list" class="list"></div>`;function draw(){const q=$('#list-search').value.toLowerCase(),tier=$('#tier')?.value;const found=list.filter(p=>p.title.toLowerCase().includes(q)&&(!tier||p.tier===tier));$('#list-count').textContent=found.length+'개 항목';$('#list').innerHTML=found.map(p=>row(p)).join('')||empty('일치하는 항목이 없습니다.')}draw();$('#list-search').addEventListener('input',draw);$('#tier')?.addEventListener('change',draw)}
function row(p,excerpt=''){const c=categories[p.category];return `<a class="listrow" href="${url(p.id)}"><span class="rowicon" aria-hidden="true">${c?.icon||'◇'}</span><div class="rowbody"><strong>${esc(p.title)}</strong><p>${esc(excerpt||[p.tier,c?.title,p.entity&&partNames[p.part]].filter(Boolean).join(' · '))}</p></div><span class="rowmeta">${esc(p.tier||c?.title)} ↗</span></a>`}
function empty(message){return `<div class="empty">${message}</div>`}
function article(id,anchor){const p=DATA.pages[id];if(!p)return missing();searchState.history=p.category==='history';activeNav(p.category);let related=p.entity?pages.filter(x=>x.entity===p.entity&&x.category!=='history'):[];const order=['README','encounter','fragment','equipment','synergies','reference','review'];related.sort((a,b)=>order.indexOf(a.part)-order.indexOf(b.part));main.innerHTML=crumb([[categories[p.category].title,categoryURL(p.category)],p.title])+`<div class="eyebrow">${esc(categories[p.category].title)}${p.tier?' / '+esc(p.tier):''}</div><h1 class="article-title">${esc(p.title)}</h1><div class="sourcebar"><span>${p.category==='history'?'아카이브 · 현재 규칙 아님':'최신 합의'} · 미정 사항은 본문에 표시</span><a href="${p.source}">원문 열기 ↗</a></div>${related.length?`<nav class="tabs" aria-label="관련 콘텐츠">${related.map(x=>`<a href="${url(x.id)}" class="${x.id===id?'active':''}">${partNames[x.part]||esc(x.title)}</a>`).join('')}</nav>`:''}${p.category==='history'?'<div class="notice">이전 설계와 검토 제안을 포함하는 기록입니다. 각 절의 상태를 확인하고 현재 설계 본문과 구분해 읽어주세요.</div>':''}<div class="article-layout"><article class="article" id="article-body">${p.html}</article><aside class="article-aside"><div class="infobox"><div class="infobox-title">문서 정보</div><dl><dt>분류</dt><dd>${esc(p.tier||categories[p.category].title)}</dd><dt>상태 읽기</dt><dd>최신 합의와 남은 미정 사항<br>구현 여부와 별개</dd><dt>관련 플레이</dt><dd class="aside-links">${relatedPlay(p)}</dd></dl></div><details class="toc-wrap" open><summary>이 문서에서</summary><nav class="toc" aria-label="문서 목차">${p.toc.filter(h=>h.level<=3).map(h=>`<a class="level-${h.level}" href="${url(id,h.anchor)}">${esc(h.title)}</a>`).join('')||'<span class="muted">개요 문서</span>'}</nav></details></aside></div>`;scrollAnchor(anchor)}
function relatedPlay(p){if(['fragments','equipment'].includes(p.category))return `<a href="${sceneURL('loadout')}">직원 로드아웃</a><a href="${sceneURL('maintenance')}">강화·개화·분쇄</a><a href="${sceneURL('battle')}">전투와 스킬 사용</a>`;if(p.category==='relics'||p.part==='synergies'||p.id==='content/tags/README')return link('rules/relics','유물 공통 규칙')+`<a href="${sceneURL('inventory')}">가방과 아이템</a>`;return `<a href="#scenes">장면·플레이어 행동</a>${link('rules/index','현재 게임 규칙')}`}
function scrollAnchor(anchor){if(!anchor)return;requestAnimationFrame(()=>{const el=document.getElementById(anchor);if(el){let p=el.parentElement;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement}el.scrollIntoView({block:'start'})}})}
function scenes(){activeNav('scenes');main.innerHTML=crumb(['장면·플레이어 행동'])+`<div class="eyebrow">PLAYER'S FIELD GUIDE</div><h1>장면·플레이어 행동</h1><p class="lead">${DATA.groups.length}개 장면 분류를 ${DATA.scenes.length}개 화면·보기·모드로 나누어 살펴봅니다. 입력과 결과, 결정 상태와 기준 문서를 확인합니다. 시안 미등록·UI 세부 미정인 제작 대상도 포함합니다.</p><div class="filters"><select id="scene-group" aria-label="장면 필터"><option value="">모든 장면</option>${DATA.groups.map(g=>`<option value="${g.id}" ${sceneState.group===g.id?'selected':''}>${g.title}</option>`).join('')}</select><select id="scene-status" aria-label="행동 결정 상태 필터"><option value="">모든 결정 상태</option>${Object.entries(DATA.statuses).map(([k,v])=>`<option value="${k}" ${sceneState.status===k?'selected':''}>${v}</option>`).join('')}</select><a href="#catalog" class="muted" style="font-size:12px">전체 ${DATA.catalog.length}개 화면군 보기 ↗</a></div><div class="result-meta" id="scene-count" aria-live="polite"></div><div class="scenegrid" id="scene-grid"></div>`;function draw(){let count=0,views=0;$('#scene-grid').innerHTML=DATA.scenes.map(s=>{if(sceneState.group&&s.group!==sceneState.group)return '';const actions=s.actions.filter(a=>!sceneState.status||a.status===sceneState.status);if(!actions.length)return '';count+=actions.length;views++;return sceneCard(s,actions)}).join('')||empty('이 조건에 해당하는 행동이 없습니다.');$('#scene-count').textContent=`${views}개 보기 · ${count}개 행동 · 결정 상태는 구현 완료 여부와 별개입니다.`}draw();$('#scene-group').addEventListener('change',e=>{sceneState.group=e.target.value;draw()});$('#scene-status').addEventListener('change',e=>{sceneState.status=e.target.value;draw()})}
const playLinks={loadout:[['content/equipment/README','장비 목록'],['content/skills/README','스킬 파편 목록'],['rules/equipment-and-fragments','장착·파편 규칙']],maintenance:[['content/skills/README','개화할 파편'],['content/equipment/README','장비 목록'],['rules/growth-and-rewards','성장·보상 규칙']],battle:[['rules/combat','전투 규칙'],['rules/battle-controls','전투 조작'],['content/skills/README','스킬 파편']],map:[['rules/run-and-map','원정·지도 규칙'],['content/abnormalities/README','환상체 목록']],inventory:[['content/relics/README','유물 목록'],['content/equipment/README','장비 목록']]};
function scene(id,action){const s=DATA.scenes.find(s=>s.id===id);if(!s)return missing();activeScene=s;activeImage=0;activeNav('scenes');main.innerHTML=crumb([['장면·행동','#scenes'],groups[s.group].title,s.title])+`<div class="eyebrow">${esc(groups[s.group].title)} / ${esc(s.kind)}</div><div class="category-head"><h1>${esc(s.title)}</h1><span class="countlabel">${s.actions.length}개 행동</span></div><p class="lead">${esc(s.subtitle)}</p><div class="scene-detail"><section>${s.images.length?`<div class="gallery"><button class="image-open" id="image-open" aria-label="시안 크게 보기"><img id="scene-image" alt=""></button><div class="galleryfoot"><span id="image-caption"></span><button id="enlarge">크게 보기 ↗</button></div></div><div class="thumbs">${s.images.length>1?s.images.map((im,i)=>`<button class="thumb" data-image="${i}" aria-pressed="${i===0}"><img src="${im.url}" alt="" loading="lazy"><span>${esc(im.caption)}</span></button>`).join(''):''}</div>`:'<div class="notice scene-no-image">대표 시안 미등록 · 아래 행동과 연결된 기준 문서를 확인하세요.</div>'}</section><aside><div class="transition"><strong>진입</strong>${esc(s.entry)}</div><div class="transition"><strong>종료·전환</strong>${esc(s.exit)}</div><div class="transition"><strong>연결된 콘텐츠</strong><div class="aside-links">${(playLinks[id]||[['rules/index','게임 규칙'],['content/README','콘텐츠 도감']]).map(([id,t])=>link(id,t)).join('')}</div></div></aside></div><section><div class="sectionhead"><h2>여기서 할 수 있는 일</h2><small>입력 → 결과 → 상세 규칙</small></div><div class="result-meta">결정 상태는 설계 합의의 상태이며 구현 완료를 뜻하지 않습니다.</div><table class="action-table"><thead><tr><th>행동</th><th>플레이어 입력</th><th>화면과 게임의 반응</th><th>결정·기준</th></tr></thead><tbody>${s.actions.map(a=>`<tr id="action-${esc(a.id)}" class="${a.id===action?'highlight':''}"><td><strong>${esc(a.title)}</strong></td><td data-label="입력">${esc(a.input)}</td><td data-label="결과">${esc(a.result)}${a.note?`<small>${esc(a.note)}</small>`:''}</td><td>${badge(a.status)}<a href="${a.url}">상세 규칙 ↗</a></td></tr>`).join('')}</tbody></table></section><section class="notice"><h3>남은 결정과 확인</h3><ul>${s.questions.map(q=>`<li>${esc(q.text)} <a href="${q.url}">기준 보기 ↗</a></li>`).join('')}</ul></section><div class="sourcebar"><span>이 화면의 상세 문서</span>${s.sourceLinks.map((u,i)=>`<a href="${u}">${esc(DATA.pages['ui/'+s.sources[i].replace('.md','')]?.title||s.sources[i])}</a>`).join('')}</div><p class="footnote">시안의 이름·수치·비용·효과는 예시입니다. 이미지와 상세 명세가 다르면 현재 명세를 따릅니다.</p>`;if(s.images.length)selectImage(0);document.querySelectorAll('[data-image]').forEach(b=>b.addEventListener('click',()=>selectImage(+b.dataset.image)));$('#image-open')?.addEventListener('click',openImage);$('#enlarge')?.addEventListener('click',openImage);if(action)requestAnimationFrame(()=>document.getElementById('action-'+action)?.scrollIntoView({block:'center'}))}
function selectImage(i){activeImage=i;const im=activeScene.images[i];$('#scene-image').src=im.url;$('#scene-image').alt=im.caption;$('#image-caption').textContent=`${i+1} / ${activeScene.images.length} · ${im.caption}`;document.querySelectorAll('[data-image]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.image===i)))}
function openImage(){const im=activeScene.images[activeImage];$('#lightbox-image').src=im.url;$('#lightbox-image').alt=im.caption;$('#lightbox-caption').textContent=im.caption;$('#lightbox').showModal()}
function search(q,archive=false){searchState.history=archive;activeNav('');main.innerHTML=crumb([archive?'아카이브 검색':'통합 검색'])+`<div class="eyebrow">SEARCH THE WIKI</div><h1>${archive?'아카이브 검색':'통합 검색'}</h1><p class="lead">문서 제목·본문과 플레이어 행동의 입력·결과를 함께 찾습니다.</p><div class="filters"><select id="search-category" aria-label="검색 분류"><option value="">모든 분류</option><option value="actions" ${searchState.category==='actions'?'selected':''}>플레이어 행동</option>${DATA.categories.filter(c=>c.id!=='history').map(c=>`<option value="${c.id}" ${searchState.category===c.id?'selected':''}>${c.title}</option>`).join('')}</select><a href="#${archive?'search':'archive-search'}=${encodeURIComponent(q)}">${archive?'현재 위키에서 검색':'아카이브에서 검색'}</a></div><div class="result-meta" id="search-count" aria-live="polite"></div><div class="list" id="results"></div>`;drawSearch(q);$('#search-category').addEventListener('change',e=>{searchState.category=e.target.value;drawSearch(q)})}
function drawSearch(q){const terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length){$('#search-count').textContent='검색어를 입력해 주세요.';$('#results').innerHTML='';return}const matched=s=>terms.every(t=>s.toLowerCase().includes(t));const results=[];for(const p of pages){if((p.category==='history')!==searchState.history)continue;if(searchState.category&&searchState.category!==p.category)continue;const hay=p.title+' '+p.text;if(!matched(hay))continue;const low=p.text.toLowerCase(),at=low.indexOf(terms[0]),excerpt=p.text.slice(Math.max(0,at-30),Math.max(0,at-30)+155);results.push({score:matched(p.title)?10:1,html:row(p,excerpt+(excerpt.length===155?'…':''))})}if(!searchState.history&&(!searchState.category||searchState.category==='actions'))for(const s of DATA.scenes)for(const a of s.actions){if(matched([s.title,a.title,a.input,a.result,a.note].join(' ')))results.push({score:matched(a.title)?12:5,html:`<a class="listrow action-result" href="${sceneURL(s.id,a.id)}"><span class="rowicon">↗</span><div class="rowbody"><strong>${esc(a.title)}</strong><p>${esc(s.title)} · ${esc(a.input)} → ${esc(a.result)}</p></div><span class="rowmeta">${badge(a.status)}</span></a>`})}results.sort((a,b)=>b.score-a.score);$('#search-count').textContent=`‘${q}’ 검색 결과 ${results.length}개${searchState.history?' · 아카이브':''}`;$('#results').innerHTML=results.map(r=>r.html).join('')||empty('일치하는 결과가 없습니다. 다른 단어로 검색해 보세요.')}
function catalog(){activeNav('catalog');main.innerHTML=crumb(['전체 화면 목록'])+`<div class="eyebrow">SCREEN INVENTORY</div><h1>전체 화면 제작 목록</h1><p class="lead">${DATA.catalog.length}개 화면군 · ${DATA.catalogStates}개 대표 상태. 상점·이벤트·부화·결과 등을 포함한 전체 화면 제작 범위입니다.</p><div class="notice">화면군의 등록은 행동 상세의 합의·구현 완료를 뜻하지 않습니다. 현재 상세 명세는 <a href="#scenes">장면·플레이어 행동</a>에서 확인하세요.</div><div class="filters"><input type="search" id="catalog-search" aria-label="화면 제작 목록 검색" placeholder="화면 이름·상태 검색… 예: 상점, 이벤트"></div><div id="catalog-count" class="result-meta" aria-live="polite"></div><div id="catalog-list"></div><div class="sourcebar">${link('ui/catalog-source','제작 목록 원문')}<a href="${DATA.catalogSource}">상태별 CSV</a></div>`;function draw(){const q=$('#catalog-search').value.toLowerCase(),found=DATA.catalog.filter(f=>[f.id,f.group,f.title,...f.states].join(' ').toLowerCase().includes(q));$('#catalog-count').textContent=`${found.length}개 화면군 · ${found.reduce((n,f)=>n+f.states.length,0)}개 상태`;$('#catalog-list').innerHTML=found.map(f=>`<details class="catalog-row"><summary><code>${esc(f.id)}</code><span>${esc(f.title)}</span><small>${esc(f.group)} · ${f.states.length}개 상태</small></summary><div class="chips">${f.states.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><p>${esc(f.presentation)} · 제작 기록: ${esc(f.coverage.join(' / '))}</p></details>`).join('')||empty('일치하는 화면이 없습니다.')}draw();$('#catalog-search').addEventListener('input',draw)}
function about(){activeNav('');main.innerHTML=crumb(['출처와 갱신'])+`<div class="eyebrow">ABOUT THIS WIKI</div><h1>하나의 위키, 이어지는 기준 문서</h1><p class="lead">콘텐츠 설계, 게임 규칙, 화면과 플레이어 행동을 한 화면에서 읽도록 묶었습니다. 상세 정책은 연결된 원문에서 관리합니다.</p><div class="article"><h2>포함한 자료</h2><ul><li>콘텐츠 설계 위키 190개 문서: 환상체·조우·파편·장비·유물·태그와 검토 기록.</li><li>게임 룰북과 주제별 게임 규칙.</li><li>장면·행동 안내서: ${DATA.groups.length}개 장면 분류, ${DATA.scenes.length}개 화면·보기·모드, ${actionCount}개 행동.</li><li>화면 상세 위키와 ${DATA.catalog.length}개 화면군·${DATA.catalogStates}개 상태의 제작 목록.</li></ul><h2>읽는 기준</h2><p>합의·제안·미정과 구현 여부를 구분합니다. 검색은 기본적으로 현재 문서를 대상으로 하며, 기록 포함을 선택하면 이전 설계도 검색합니다. 내부 설계용이므로 숨겨진 기믹도 포함합니다.</p><h2>갱신</h2><p>해당 기준 Markdown을 수정하고, 행동 요약을 바꾼 경우 UI 프로젝트의 <code>wiki/scene-guide.json</code>도 갱신합니다. simulator 저장소 루트에서 아래 명령으로 통합 HTML을 다시 만듭니다.</p><pre><code>python3 core_enhanced/tools/wiki/build.py</code></pre><p>다른 폴더 배치에서는 <code>--ui-root</code>로 UI 문서 디렉터리를 지정합니다. 이미지와 원문 링크를 사용하려면 두 프로젝트의 상대 위치를 유지하거나 재생성합니다. 문서와 검색 데이터는 HTML에 포함되어 서버와 인터넷 없이 열립니다.</p><div class="sourcebar"><a href="README.md">구성과 갱신 안내</a><a href="build-report.json">내용·링크 검증 기록</a><a href="${DATA.uiOriginal}">기존 장면·행동 안내서</a>${link('content/maintenance/README','원문 보존·이관 기록')}</div></div>`}
function missing(){activeNav('');main.innerHTML=empty('문서를 찾을 수 없습니다. <a href="#home">위키 홈으로 돌아가기 →</a>')}
function closeMenu(){const narrow=innerWidth<=800;$('#sidebar').classList.remove('open');$('#sidebar').inert=narrow;$('#overlay').classList.remove('visible');$('#menu').setAttribute('aria-expanded','false')}
function route(){if($('#lightbox').open)$('#lightbox').close();closeMenu();const raw=location.hash.slice(1),p=new URLSearchParams(raw);if(raw==='main'){main.focus();return}window.scrollTo({top:0,behavior:'instant'});let title='ARK 게임 위키';if(!raw||raw==='home'||raw==='overview')home();else if(raw==='scenes')scenes();else if(raw==='catalog')catalog();else if(raw==='about')about();else if(p.has('category')){category(p.get('category'));title=categories[p.get('category')]?.title||title}else if(p.has('page')){article(p.get('page'),p.get('section'));title=DATA.pages[p.get('page')]?.title||title}else if(p.has('scene')){scene(p.get('scene'),p.get('action'));title=DATA.scenes.find(s=>s.id===p.get('scene'))?.title||title}else if(p.has('archive-search')){$('#search').value=p.get('archive-search');search(p.get('archive-search'),true);title='아카이브 검색'}else if(p.has('search')){$('#search').value=p.get('search');search(p.get('search'));title='통합 검색'}else if(p.has('doc')){article('ui/'+p.get('doc'),p.get('anchor'))}else missing();document.title=title==='ARK 게임 위키'?title:title+' | ARK 위키'}
$('#search').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>{const archive=searchState.history;history.replaceState(null,'','#'+(archive?'archive-search':'search')+'='+encodeURIComponent(q));search(q,archive);document.title=(archive?'아카이브 검색':'통합 검색')+' | ARK 위키';window.scrollTo({top:0,behavior:'instant'})},140)});
$('#menu').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#sidebar').inert=!open;$('#overlay').classList.toggle('visible',open);$('#menu').setAttribute('aria-expanded',String(open));if(open)$('#sidebar a').focus()});$('#sidebar').addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});$('#overlay').addEventListener('click',closeMenu);$('#print').addEventListener('click',()=>window.print());$('#close-lightbox').addEventListener('click',()=>$('#lightbox').close());$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').close()});document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&$('#sidebar').classList.contains('open')){closeMenu();$('#menu').focus()}});window.addEventListener('resize',()=>{if(innerWidth>800)closeMenu();else if(!$('#sidebar').classList.contains('open'))$('#sidebar').inert=true});window.addEventListener('hashchange',route);nav();route();
</script>
</body>
