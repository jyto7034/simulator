<text x="900" y="1360" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="700" fill="#25354b">여섯 자리를 하나의 고리로 연결해, 출구 앞에서도 반대쪽 탐사를 이어갈 수 있음.</text>
<text x="900" y="1404" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="23" font-weight="400" fill="#25354b">막다른 곁방 없이 한 바퀴 돌아오는 작은 탐사 방. 가운데 횡단 연결은 없음.</text>
<text x="900" y="1470" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="20" font-weight="400" fill="#65758a">입구→출구 직행 없음 · 실제 이동은 노드 해결 상태를 따름 · 세로 위치는 층수가 아님</text>
