# Current support coefficients; duration and radius are test-only values.
version: 1
id: support-radius-fixture
values:
  - name: regular-support
    value:
      Effects:
        - id: support
          op:
            Sustained:
              definition:
                ChannelAura:
                  duration_ms: 201
                  aura:
                    family: authored-support
                    priority: 0
                    prefer_strongest: true
                    radius_units: 1600000
                    basic_damage_percent: 20
                    basic_speed_points: 15
                    basic_scope: RegularOnly
                    support:
                      conversion:
                        relic_definition: single-target-conversion
                        variant: Normal
                        selection_range:
                          include_anchor_tile: true
                          rows: [XXXXX, XXXXX, XX@XX, XXXXX, XXXXX]
                        replacement:
                          RegularBasic:
                            damage_percent: 40
                            speed_points: 20
  - name: radius-increase
    value: { Count: 25 }
definitions:
  - name: maintain-support
    parameters:
      - name: effects
        value_type: Effects
      - name: extra-radius
        value_type: Count
    body:
      Action:
        id: maintain
        target: { Literal: { Target: SelfUnit } }
        delivery: { Literal: { Delivery: Instant } }
        effects:
          - Append:
              effects: { Parameter: effects }
        modifiers:
          - id: expand-support
            relic_definition: resonator
            variant: Normal
            change:
              SupportRadius:
                effect: support
                percent: { Parameter: extra-radius }
        wait: EffectsSettled
skills:
  - id: authored-channel-support
    name: 원형 지원 반경 검사
    kind: Untargeted
    cast_targeting:
      Explicit:
        selection: self
        target: SelfUnit
        reach: pattern
        air_capable: true
    prepare_ms: 0
    focus_permissions:
      allows_move: false
      allows_basic_attack: false
    admission:
      capacity: 100
      requirement: Full
      cost: All
    body:
      Call:
        id: support
        definition: maintain-support
        arguments:
          - name: effects
            value: { Shared: regular-support }
          - name: extra-radius
            value: { Shared: radius-increase }
