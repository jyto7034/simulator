# Test-only duration, geometry and power. No production balance is decided here.
version: 1
id: manual-state-fixture
values:
  - name: transformation
    value:
      Effects:
        - id: form
          op:
            Sustained:
              definition:
                State:
                  duration_ms: 2000
                  program:
                    id: temporary-weapon
                    owns_use: true
                    end_on_source_exit: true
                    replacement: ReplaceSameSource
                    basic_attack:
                      range_policy: whole_field_valid_tiles
                      defense_tile_range: null
                      delivery: Instant
                      followup_on_input: false
                      line:
                        length_units: 6500000
                        width_units: 500000
                        power: 40
                        weapon_effects: true
                        piercing_relics: true
                        piercing:
                          relic_definition: piercing-damage-increase
                          increment_percent: 25
                          cap_percent: 50
                    fields: []
                    handlers:
                      - id: finish-on-input
                        event: ManualInput
                        body:
                          - EndAndInvoke:
                              skill: authored-finish
  - name: finish-power
    value:
      Amount:
        moment: Snapshot
        root:
          Clamp:
            value:
              Add:
                - Const: { value: 10, unit: Magnitude }
                - Mul:
                    value:
                      Const: { value: 1, unit: Magnitude }
                    scalar:
                      Ratio:
                        numerator:
                          Mul:
                            value:
                              Read:
                                Time: RemainingTime
                            scalar:
                              Const: { value: 20, unit: Scalar }
                        denominator:
                          Const: { value: 1000, unit: Milliseconds }
                        rounding: Floor
            min:
              Const: { value: 0, unit: Magnitude }
            max:
              Const: { value: 45, unit: Magnitude }
definitions:
  - name: apply-self
    parameters:
      - name: effects
        value_type: Effects
    body:
      Action:
        id: install
        target:
          Literal:
            Target: SelfUnit
        delivery:
          Literal:
            Delivery: Instant
        effects:
          - Append:
              effects:
                Parameter: effects
        wait: Released
skills:
  - id: authored-manual-state
    name: 수동 마무리 상태 검사
    kind: Untargeted
    cast_targeting:
      Explicit:
        selection: self
        target: SelfUnit
        reach: pattern
        air_capable: true
    prepare_ms: 0
    focus_permissions:
      allows_move: true
      allows_basic_attack: true
    admission:
      capacity: 100
      requirement: Full
      cost: All
    body:
      Call:
        id: transform
        definition: apply-self
        arguments:
          - name: effects
            value:
              Shared: transformation
  - id: authored-finish
    name: 고정 잔여 시간 일격 검사
    kind: Untargeted
    cast_targeting:
      Explicit:
        selection: self
        target: SelfUnit
        reach: pattern
        air_capable: true
    prepare_ms: 0
    focus_permissions:
      allows_move: true
      allows_basic_attack: true
    admission:
      capacity: 100
      requirement: None
      cost: Zero
    body:
      Action:
        id: strike
        target:
          Literal:
            Target: SelfUnit
        delivery:
          Literal:
            Delivery:
              TileArea:
                footprint:
                  include_anchor_tile: true
                  rows: [XXXXXXXXX, XXXXXXXXX, XXXXXXXXX, XXXXXXXXX, XXXX@XXXX, XXXXXXXXX, XXXXXXXXX, XXXXXXXXX, XXXXXXXXX]
                area:
                  anchor: Caster
                  tile_origin: Caster
        effects:
          - Damage:
              id: remaining-time-impact
              tags: [finish]
              amount:
                Shared: finish-power
              damage_type: Physical
        wait: EffectsSettled
